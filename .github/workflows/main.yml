name: Build libExtender dylibs (Linux)

# Builds GameController.dylib + ReExtendioDylib.dylib (and the empty.dylib
# placeholder) on Ubuntu using the Theos Linux toolchain, patches the reexport,
# and uploads the results. On a tag push (v*) it also attaches them to a Release.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create/update Releases

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            build-essential fakeroot libxml2 \
            perl git curl wget unzip xz-utils zip rsync
          # clang-11 from the toolchain needs libtinfo5, which was dropped in
          # Ubuntu 24.04. Try the repo first, then fall back to the focal .deb.
          if ! sudo apt-get install -y libtinfo5; then
            curl -fsSL -o /tmp/libtinfo5.deb \
              http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb
            sudo dpkg -i /tmp/libtinfo5.deb || sudo apt-get install -fy
          fi

      - name: Cache Theos (toolchain + SDKs)
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-linux-x86_64-iphoneos-v1

      - name: Install Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

          # Linux iOS toolchain (clang + cctools: install_name_tool, ldid, otool...)
          mkdir -p "$THEOS/toolchain"
          curl -fsSL \
            https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | tar -xJf - -C "$THEOS/toolchain/"

          # iOS SDKs (shallow clone, keep only iPhoneOS SDKs)
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/theos-sdks
          cp -a /tmp/theos-sdks/iPhoneOS*.sdk "$THEOS/sdks/"
          rm -rf /tmp/theos-sdks

      - name: Build dylibs
        run: |
          set -euxo pipefail
          export THEOS="$THEOS"
          export PATH="$THEOS/toolchain/linux/iphone/bin:$PATH"

          # GameController.dylib (root project)
          make clean || true
          make

          # empty.dylib + ReExtendioDylib.dylib
          ( cd ReExtendioDylib && make clean || true; make )

      - name: Collect & patch artifacts
        run: |
          set -euxo pipefail
          export THEOS="$THEOS"
          export PATH="$THEOS/toolchain/linux/iphone/bin:$PATH"

          mkdir -p dist
          cp .theos/obj/debug/GameController.dylib dist/
          cp ReExtendioDylib/.theos/obj/debug/ReExtendioDylib.dylib dist/
          cp ReExtendioDylib/.theos/obj/debug/empty.dylib dist/ || true

          # Patch reexport: empty.dylib -> libSystem.B.dylib
          bash PatchDylib.sh dist/ReExtendioDylib.dylib

          echo "=== Architectures ==="
          for f in dist/*.dylib; do
            echo "--- $f ---"
            lipo -info "$f" || true
          done

          echo "=== ReExtendioDylib reexport (should be libSystem.B.dylib) ==="
          otool -l dist/ReExtendioDylib.dylib | grep -A2 LC_REEXPORT_DYLIB || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iExtendio-dylibs
          path: dist/*.dylib
          if-no-files-found: error

      - name: Attach to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dylib
          generate_release_notes: true
